<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengiraan Sudut Pedalaman Poligon</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        label { font-weight: bold; color: #34495e; display: block; margin-bottom: 10px; }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #27ae60; }
        .result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
            padding: 10px;
            border-radius: 5px;
            background-color: #e8f4f8;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📐 Sistem Pengiraan Sudut Pedalaman Poligon</h2>
    <label for="sisi">Masukkan Bilangan Sisi Poligon (n):</label>
    <input type="number" id="sisi" min="3" placeholder="Contoh: 3, 4, 5...">
    <br>
    <button onclick="kiraSudut()">Kira Sudut</button>

    <div id="hasil" class="result"></div>
</div>

<script>
    function kiraSudut() {
        // Mengambil input daripada kotak teks (seperti fungsi input() dalam Python)
        let n = parseInt(document.getElementById('sisi').value);
        let hasilDiv = document.getElementById('hasil');

        // Validasi input (Ralat Logik jika sisi kurang daripada 3)
        if (isNaN(n) || n < 3) {
            hasilDiv.style.display = "block";
            hasilDiv.style.color = "#c0392b";
            hasilDiv.style.backgroundColor = "#f9d5d5";
            hasilDiv.innerHTML = "⚠️ Sila masukkan bilangan sisi yang sah (minimum 3 sisi).";
            return;
        }

        // Formula Proses: (n - 2) * 180
        let jumlahSudut = (n - 2) * 180;

        // Memaparkan Output ke skrin
        hasilDiv.style.display = "block";
        hasilDiv.style.color = "#2980b9";
        hasilDiv.style.backgroundColor = "#e8f4f8";
        hasilDiv.innerHTML = `Jumlah Sudut Pedalaman bagi poligon ${n} sisi ialah: <br><span style="font-size: 24px; color: #27ae60;">${jumlahSudut}°</span>`;
    }
</script>

</body>
</html>
