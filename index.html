<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Maklumat Sudut Pedalaman Poligon</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        label { font-weight: bold; color: #34495e; display: block; margin-bottom: 10px; }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #2980b9; }
        .result {
            margin-top: 25px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .error-message {
            color: #c0392b;
            background-color: #f9d5d5;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📐 Sistem Analisis Poligon Sekata</h2>
    <label for="sisi">Masukkan Bilangan Sisi Poligon (n):</label>
    <input type="number" id="sisi" min="3" placeholder="Contoh: 3, 4, 5...">
    <br>
    <button onclick="kiraPoligon()">Analisis Poligon</button>

    <div id="error" class="error-message"></div>

    <div id="hasil" class="result">
        <h3>📋 Keputusan Analisis:</h3>
        <table>
            <tr>
                <th>Ciri Poligon</th>
                <th>Maklumat</th>
            </tr>
            <tr>
                <td><strong>Nama Poligon</strong></td>
                <td id="resNama">-</td>
            </tr>
            <tr>
                <td><strong>Bilangan Sisi (n)</strong></td>
                <td id="resSisi">-</td>
            </tr>
            <tr>
                <td><strong>Jumlah Sudut Pedalaman</strong></td>
                <td id="resJumlah" style="color: #e67e22; font-weight: bold;">-</td>
            </tr>
            <tr>
                <td><strong>Setiap Sudut Pedalaman</strong></td>
                <td id="resSetiap" style="color: #27ae60; font-weight: bold;">-</td>
            </tr>
        </table>
    </div>
</div>

<script>
    function dapatkanNamaPoligon(n) {
        const senaraiNama = {
            3: "Segi Tiga",
            4: "Segi Empat",
            5: "Pentagon",
            6: "Heksagon",
            7: "Heptagon",
            8: "Oktagon",
            9: "Nonagon",
            10: "Dekagon"
        };
        return senaraiNama[n] || "Poligon-" + n;
    }

    function kiraPoligon() {
        let n = parseInt(document.getElementById('sisi').value);
        let hasilDiv = document.getElementById('hasil');
        let errorDiv = document.getElementById('error');

        // Hadkan input minimum 3 sisi
        if (isNaN(n) || n < 3) {
            errorDiv.style.display = "block";
            hasilDiv.style.display = "none";
            errorDiv.innerHTML = "⚠️ Sila masukkan bilangan sisi yang sah (minimum 3 sisi).";
            return;
        }

        errorDiv.style.display = "none";

        // Formula Pengiraan
        let nama = dapatkanNamaPoligon(n);
        let jumlahSudut = (n - 2) * 180;
        let setiapSudut = (jumlahSudut / n).toFixed(2); // Hadkan kepada 2 tempat perpuluhan

        // Paparkan keputusan dalam jadual
        document.getElementById('resNama').innerText = nama;
        document.getElementById('resSisi').innerText = n + " sisi";
        document.getElementById('resJumlah').innerText = jumlahSudut + "°";
        document.getElementById('resSetiap').innerText = setiapSudut + "°";

        hasilDiv.style.display = "block";
    }
</script>

</body>
</html>
